# Isolated workshop development stack overlay for PentAGI.
# Runs safely beside a live /home/abderrahman/pentagi installation with zero collisions:
#   - Dedicated Compose project name (`-p pentagi-workshop`)
#   - Distinct container names, all three base network names, host ports, and tenant ID
#   - Non-overlapping sandbox port range (DOCKER_PORTS_BASE=32000; live=28000, e2e=30000)
#   - Committed examples/configs mounts (prevents Docker creating directories over missing files)
#
# Launch (with an explicit workshop env file, never the live .env):
#   docker compose -p pentagi-workshop --env-file .env.workshop \
#     -f docker-compose.yml -f docker-compose.workshop.yml \
#     up -d --wait --wait-timeout 240

networks:
  pentagi-network:
    name: pentagi-workshop-network
  observability-network:
    name: pentagi-workshop-observability-network
  langfuse-network:
    name: pentagi-workshop-langfuse-network

services:
  pentagi:
    container_name: pentagi-workshop
    ports: !override
      - "${WORKSHOP_LISTEN_IP:-127.0.0.1}:${WORKSHOP_LISTEN_PORT:-8445}:8443"
    environment:
      - TENANT_ID=${WORKSHOP_TENANT_ID:-workshop}
      - INSTALLATION_ID=${WORKSHOP_INSTALLATION_ID:-pentagi-workshop-dev}
      - COOKIE_SIGNING_SALT=${WORKSHOP_COOKIE_SIGNING_SALT:-workshop-dev-cookie-salt-change-me}
      - DOCKER_PORTS_BASE=${WORKSHOP_DOCKER_PORTS_BASE:-32000}
    volumes:
      - ./examples/configs/custom-openai.provider.yml:/opt/pentagi/conf/custom.provider.yml:ro
      - ./examples/configs/ollama-llama318b-instruct.provider.yml:/opt/pentagi/conf/ollama.provider.yml:ro
      - ./examples/configs/bedrock.provider.yml:/opt/pentagi/conf/bedrock.provider.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO /dev/null https://127.0.0.1:8443/api/v1/info",
        ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  pgvector:
    container_name: pentagi-workshop-pgvector
    ports: !override
      - "${WORKSHOP_PGVECTOR_LISTEN_IP:-127.0.0.1}:${WORKSHOP_PGVECTOR_LISTEN_PORT:-5435}:5432"

  pgexporter:
    container_name: pentagi-workshop-pgexporter
    ports: !override
      - "${WORKSHOP_PGEXPORTER_LISTEN_IP:-127.0.0.1}:${WORKSHOP_PGEXPORTER_LISTEN_PORT:-9189}:9187"

  scraper:
    container_name: pentagi-workshop-scraper
    ports: !override
      - "${WORKSHOP_SCRAPER_LISTEN_IP:-127.0.0.1}:${WORKSHOP_SCRAPER_LISTEN_PORT:-9445}:443"
