# Example PentAGI Custom Provider configuration routing all 13 agent roles
# through the opt-in `cli-bridge` OpenCode driver (`LLM_SERVER_URL=http://cli-bridge:8090/v1`).
# Allowlist `opencode` in CLI_BRIDGE_ENABLED_DRIVERS. The bridge strips the first
# `opencode/` prefix and passes the remainder to `opencode run --model`.

simple:
  model: "opencode/opencode-go/claude-haiku-5-5"
  temperature: 0.4
  top_p: 0.5
  n: 1
  max_tokens: 3000
  price:
    input: 0.0
    output: 0.0

